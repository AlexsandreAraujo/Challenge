# BOOTSTRAP (só na primeira vez, num servidor novo, sem certificado ainda):
# 1. Comente o bloco "server { listen 443 ssl; ... }" inteiro, abaixo.
# 2. docker compose up -d --build backend nginx
# 3. docker compose run --rm --entrypoint certbot certbot certonly \
#      --webroot -w /var/www/certbot -d desafio-alexsandre.duckdns.org \
#      --email SEU_EMAIL --agree-tos --no-eff-email
# 4. Descomente o bloco 443 de volta.
# 5. docker compose up -d --build nginx
# 6. docker compose up -d certbot   (liga a renovação automática, em loop)

server {
    listen 80;
    server_name desafio-alexsandre.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name desafio-alexsandre.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/desafio-alexsandre.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desafio-alexsandre.duckdns.org/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}